spring.application.name=baozistore

# Configuração do Banco de Dados H2 (em memória)
spring.datasource.url=jdbc:h2:mem:baozidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar o Console Web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualização automática do banco com JPA e visualização do SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true